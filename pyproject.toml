[project]
name = "slm-shield"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes>=0.46.1",
    "datasets>=5.0.0",
    "fastapi>=0.138.1",
    "huggingface-hub>=1.21.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.0.0",
    "pandas>=3.0.3",
    "pandas-stubs~=3.0.3",
    "peft>=0.19.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "torch>=2.2.1",
    "transformers>=5.12.1",
    "uvicorn>=0.49.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
